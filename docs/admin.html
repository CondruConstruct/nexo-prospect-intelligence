<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Administrare — QR Forever</title><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="referrer" content="no-referrer"></head><body><main class="wrap page"><a class="brand" href="/">QR Forever</a><h1>Evenimentele tale</h1><p class="notice" id="admin-notice">Mod de pregătire: poți genera o previzualizare și un QR demonstrativ. Datele nu se salvează, iar albumul nu primește fotografii.</p><section id="login" hidden class="card"><h2>Acces administrator</h2><form id="login-form"><div class="field"><label for="admin-key">Cheie de acces</label><input id="admin-key" type="password" autocomplete="off" required></div><button class="btn">Conectare</button></form></section><section id="editor" class="card"><form id="event-form"><div class="field"><label for="name">Denumirea evenimentului</label><input id="name" required maxlength="120" placeholder="Nunta Ana & Mihai"></div><div class="field"><label for="date">Data evenimentului</label><input id="date" type="date" required></div><div class="field"><label for="quota">Spațiu alocat (GB)</label><input id="quota" type="number" min="1" max="1000" step="1" value="10" required></div><div class="field"><label for="retention">Păstrare după eveniment (zile)</label><input id="retention" type="number" min="1" max="3650" step="1" value="90" required></div><button id="create-btn" class="btn full">Generează previzualizarea și QR-ul</button></form></section><p id="admin-error" class="error-msg" role="alert"></p><section id="qr-result" class="card" hidden><h2 id="qr-title" class="print-title"></h2><p id="qr-label" class="status"></p><div class="qr-frame" id="qr"></div><a id="guest-link" class="code-link"></a><div class="actions no-print"><a id="download-qr" class="btn" download="qr-eveniment.svg">Descarcă QR</a><button id="print-qr" class="btn btn-ghost">Printează</button><button id="copy-link" class="btn btn-ghost">Copiază linkul</button></div></section><section id="events" hidden><h2>Evenimente configurate</h2><div id="event-list"></div><button id="logout" class="btn btn-ghost">Deconectare</button></section></main><footer class="site-footer">QR Forever · <a href="mailto:danscutari04@gmail.com">Contact</a></footer><script src="/vendor/qrcode.js"></script><script src="/js/config.js"></script><script src="/js/admin.js"></script></body></html>
